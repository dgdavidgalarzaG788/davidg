<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubicación y Mapa</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            color: #212529;
        }

        /* Navbar elegante con efecto glassmorphism */
        .navbar-custom {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .navbar-brand {
            font-weight: 600;
            color: #0f172a;
        }

        .nav-link {
            font-weight: 500;
            color: #64748b;
            transition: color 0.2s ease-in-out;
            padding: 0.5rem 1rem !important;
        }

        .nav-link:hover, .nav-link.active {
            color: #2563eb !important;
        }

        /* Contenedor del mapa */
        .map-card {
            border: none;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            background: #ffffff;
        }

        .map-container {
            position: relative;
            width: 100%;
            height: 450px;
            border-radius: 12px;
            overflow: hidden;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>

    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <i class="bi bi-geo-alt-fill text-primary"></i> MiSitio
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="columnas.html">Columnas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="targetas.html">Tarjetas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">Deshabilitado</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                
                <div class="card map-card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h2 class="h4 mb-1 fw-bold text-dark">Nuestra Ubicación</h2>
                            <p class="text-muted small mb-0">Explora la zona interactiva a continuación</p>
                        </div>
                        <a href="https://www.openstreetmap.org/#map=14/-0.30362/-78.54692" 
                           target="_blank" 
                           class="btn btn-outline-primary btn-sm rounded-pill px-3">
                            <i class="bi bi-box-arrow-up-right me-1"></i> Ver mapa completo
                        </a>
                    </div>

                    <!-- Contenedor Mapa Corregido -->
                    <div class="map-container">
                        <iframe 
                            src="https://www.openstreetmap.org/export/embed?bbox=-78.5870933532715%2C-0.333107025434489%2C-78.50675582885744%2C-0.2741421729897075&amp;layer=mapnik" 
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
